<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кузнєцов Владислав Юрійович, ІС-44, ЛР-3, Варіант 7 (Float)</title>
    <link rel="stylesheet" href="zavd1_style.css">
</head>
<body>

    <div class="workspace">
        <!-- Верхня горизонтальна лінійка (0..22 см) -->
        <div class="ruler-top">
            <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
            <span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span>
            <span>12</span><span>13</span><span>14</span><span>15</span><span>16</span><span>17</span>
            <span>18</span><span>19</span><span>20</span><span>21</span><span>22</span>
        </div>

        <!-- Ліва вертикальна лінійка (0..22 см) -->
        <div class="ruler-left">
            <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
            <span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span>
            <span>12</span><span>13</span><span>14</span><span>15</span><span>16</span><span>17</span>
            <span>18</span><span>19</span><span>20</span><span>21</span><span>22</span>
        </div>

        <!-- Сірий квадрат із білим аркушем усередині -->
        <div class="gray-square">
            <div class="white-sheet">
                <!-- Блакитні направляючі (горизонтальні та вертикальні) -->
                <div class="guide-h g-h-1"></div>
                <div class="guide-h g-h-2"></div>
                <div class="guide-h g-h-3"></div>
                <div class="guide-h g-h-4"></div>
                <div class="guide-h g-h-5"></div>

                <div class="guide-v g-v-1"></div>
                <div class="guide-v g-v-2"></div>
                <div class="guide-v g-v-3"></div>
                <div class="guide-v g-v-4"></div>

                <!-- Темплейт Варіанта 7 (Float + % ширина) -->
                <div class="template-box">
                    <header class="header-text">
                        <h2>Text</h2>
                    </header>

                    <div class="middle-row">
                        <div class="content-img">
                            <h2>Img.</h2>
                        </div>
                        <aside class="sidebar-text">
                            <h2>Text</h2>
                        </aside>
                        <div class="clear"></div>
                    </div>

                    <footer class="footer-img">
                        <h2>Img.</h2>
                    </footer>
                </div>
            </div>
        </div>
    </div>

    <div class="nav-links">
        <a href="flex.html">Перейти до Завдання 2 (Flex) &rarr;</a>
    </div>

</body>
</html>
